<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="polyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="zstdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gzipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="xzGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#bg3)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="42" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    EMPIRICAL LOSSLESS BENCHMARK COMPARISON
  </text>
  <text x="480" y="66" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" text-anchor="middle">
    polycryst (.cryst) vs. Meta Zstandard (zstd -19), Gzip (-9), and XZ (-9) across Filesystem Samples
  </text>

  <!-- Panel 1: Solid Monocrystal (10,000 Bytes) -->
  <g transform="translate(40, 95)">
    <rect width="425" height="155" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700">
      Solid Monocrystal (10,000 Bytes of 'A')
    </text>
    <text x="405" y="28" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">SHA-256 MATCH</text>

    <!-- Bars -->
    <!-- polycryst: 11 B -->
    <text x="20" y="58" fill="#a7f3d0" font-family="monospace" font-size="11">polycryst .cryst</text>
    <rect x="140" y="46" width="30" height="15" rx="3" fill="url(#polyGrad)"/>
    <text x="180" y="58" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">11 B (0.11%) [WINNER]</text>

    <!-- zstd -19: 22 B -->
    <text x="20" y="82" fill="#93c5fd" font-family="monospace" font-size="11">zstd -19 (Meta)</text>
    <rect x="140" y="70" width="55" height="15" rx="3" fill="url(#zstdGrad)"/>
    <text x="205" y="82" fill="#60a5fa" font-family="monospace" font-size="11">22 B (0.22%)</text>

    <!-- gzip -9: 63 B -->
    <text x="20" y="106" fill="#fde68a" font-family="monospace" font-size="11">gzip -9</text>
    <rect x="140" y="94" width="130" height="15" rx="3" fill="url(#gzipGrad)"/>
    <text x="280" y="106" fill="#fbbf24" font-family="monospace" font-size="11">63 B (0.63%)</text>

    <!-- xz -9: 116 B -->
    <text x="20" y="130" fill="#ddd6fe" font-family="monospace" font-size="11">xz -9</text>
    <rect x="140" y="118" width="220" height="15" rx="3" fill="url(#xzGrad)"/>
    <text x="370" y="130" fill="#a78bfa" font-family="monospace" font-size="11">116 B (1.16%)</text>
  </g>

  <!-- Panel 2: Harmonic Stride (2,375 Bytes) -->
  <g transform="translate(495, 95)">
    <rect width="425" height="155" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700">
      Harmonic ASCII Ramps (2,375 Bytes)
    </text>
    <text x="405" y="28" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">SHA-256 MATCH</text>

    <!-- Bars -->
    <!-- polycryst: 108 B -->
    <text x="20" y="58" fill="#a7f3d0" font-family="monospace" font-size="11">polycryst .cryst</text>
    <rect x="140" y="46" width="110" height="15" rx="3" fill="url(#polyGrad)"/>
    <text x="260" y="58" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">108 B (4.55%) [WINNER]</text>

    <!-- zstd -19: 119 B -->
    <text x="20" y="82" fill="#93c5fd" font-family="monospace" font-size="11">zstd -19 (Meta)</text>
    <rect x="140" y="70" width="125" height="15" rx="3" fill="url(#zstdGrad)"/>
    <text x="275" y="82" fill="#60a5fa" font-family="monospace" font-size="11">119 B (5.01%)</text>

    <!-- gzip -9: 153 B -->
    <text x="20" y="106" fill="#fde68a" font-family="monospace" font-size="11">gzip -9</text>
    <rect x="140" y="94" width="160" height="15" rx="3" fill="url(#gzipGrad)"/>
    <text x="310" y="106" fill="#fbbf24" font-family="monospace" font-size="11">153 B (6.44%)</text>

    <!-- xz -9: 180 B -->
    <text x="20" y="130" fill="#ddd6fe" font-family="monospace" font-size="11">xz -9</text>
    <rect x="140" y="118" width="190" height="15" rx="3" fill="url(#xzGrad)"/>
    <text x="340" y="130" fill="#a78bfa" font-family="monospace" font-size="11">180 B (7.58%)</text>
  </g>

  <!-- Panel 3: Systems Source Code (15,316 Bytes) -->
  <g transform="translate(40, 270)">
    <rect width="425" height="155" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700">
      Rust Systems Code (15,316 Bytes)
    </text>
    <text x="405" y="28" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">SHA-256 MATCH</text>

    <text x="20" y="58" fill="#a7f3d0" font-family="monospace" font-size="11">polycryst .cryst</text>
    <rect x="140" y="46" width="160" height="15" rx="3" fill="url(#polyGrad)"/>
    <text x="310" y="58" fill="#34d399" font-family="monospace" font-size="11">8,139 B (53.1%)</text>

    <text x="20" y="82" fill="#93c5fd" font-family="monospace" font-size="11">zstd -19 (Meta)</text>
    <rect x="140" y="70" width="90" height="15" rx="3" fill="url(#zstdGrad)"/>
    <text x="240" y="82" fill="#60a5fa" font-family="monospace" font-size="11">4,445 B (29.0%)</text>

    <text x="20" y="106" fill="#fde68a" font-family="monospace" font-size="11">gzip -9</text>
    <rect x="140" y="94" width="95" height="15" rx="3" fill="url(#gzipGrad)"/>
    <text x="245" y="106" fill="#fbbf24" font-family="monospace" font-size="11">4,558 B (29.7%)</text>

    <text x="20" y="130" fill="#ddd6fe" font-family="monospace" font-size="11">xz -9</text>
    <rect x="140" y="118" width="90" height="15" rx="3" fill="url(#xzGrad)"/>
    <text x="240" y="130" fill="#a78bfa" font-family="monospace" font-size="11">4,408 B (28.7%)</text>
  </g>

  <!-- Panel 4: Physical TRNG Entropy Falsification (10,240 Bytes) -->
  <g transform="translate(495, 270)">
    <rect width="425" height="155" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700">
      Physical TRNG Noise (10,240 Bytes)
    </text>
    <text x="405" y="28" fill="#ef4444" font-family="monospace" font-size="11" text-anchor="end">2nd LAW PROVEN</text>

    <text x="20" y="58" fill="#a7f3d0" font-family="monospace" font-size="11">polycryst .cryst</text>
    <rect x="140" y="46" width="180" height="15" rx="3" fill="#ef4444" fill-opacity="0.6"/>
    <text x="330" y="58" fill="#fca5a5" font-family="monospace" font-size="11">10,407 B (+167 B)</text>

    <text x="20" y="82" fill="#93c5fd" font-family="monospace" font-size="11">zstd -19 (Meta)</text>
    <rect x="140" y="70" width="180" height="15" rx="3" fill="#ef4444" fill-opacity="0.6"/>
    <text x="330" y="82" fill="#fca5a5" font-family="monospace" font-size="11">10,254 B (+14 B)</text>

    <text x="20" y="106" fill="#fde68a" font-family="monospace" font-size="11">gzip -9</text>
    <rect x="140" y="94" width="180" height="15" rx="3" fill="#ef4444" fill-opacity="0.6"/>
    <text x="330" y="106" fill="#fca5a5" font-family="monospace" font-size="11">10,279 B (+39 B)</text>

    <text x="20" y="130" fill="#ddd6fe" font-family="monospace" font-size="11">xz -9</text>
    <rect x="140" y="118" width="180" height="15" rx="3" fill="#ef4444" fill-opacity="0.6"/>
    <text x="330" y="130" fill="#fca5a5" font-family="monospace" font-size="11">10,308 B (+68 B)</text>
  </g>
</svg>
