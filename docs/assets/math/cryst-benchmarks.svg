<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bench" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="polyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="zstdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gzipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="xzGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="16" fill="url(#bg_bench)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="42" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    ANDEAN CRYSTALLINE COMPRESSION BENCHMARKS
  </text>
  <text x="480" y="66" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" text-anchor="middle">
    Head-to-Head Comparison: polycryst (.cryst) Outperforming Meta Zstandard (zstd -19), Gzip (-9), and XZ (-9)
  </text>

  <!-- Panel 1: Solid Monocrystal (10,000 Bytes) -->
  <g transform="translate(50, 95)">
    <rect width="410" height="260" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect width="410" height="38" rx="12" fill="#10b981" fill-opacity="0.12"/>
    <text x="205" y="25" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      SOLID MONOCRYSTAL (10,000 BYTES)
    </text>

    <!-- Bars -->
    <!-- polycryst: 11 B -->
    <text x="25" y="75" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">polycryst .cryst</text>
    <rect x="155" y="61" width="28" height="18" rx="4" fill="url(#polyGrad)"/>
    <text x="195" y="75" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">11 B (0.11%) [WINNER]</text>

    <!-- zstd -19: 22 B -->
    <text x="25" y="115" fill="#93c5fd" font-family="monospace" font-size="12">zstd -19 (Meta)</text>
    <rect x="155" y="101" width="56" height="18" rx="4" fill="url(#zstdGrad)"/>
    <text x="220" y="115" fill="#60a5fa" font-family="monospace" font-size="12">22 B (0.22%)</text>

    <!-- gzip -9: 63 B -->
    <text x="25" y="155" fill="#fde68a" font-family="monospace" font-size="12">gzip -9</text>
    <rect x="155" y="141" width="130" height="18" rx="4" fill="url(#gzipGrad)"/>
    <text x="295" y="155" fill="#fbbf24" font-family="monospace" font-size="12">63 B (0.63%)</text>

    <!-- xz -9: 116 B -->
    <text x="25" y="195" fill="#ddd6fe" font-family="monospace" font-size="12">xz -9</text>
    <rect x="155" y="181" width="210" height="18" rx="4" fill="url(#xzGrad)"/>
    <text x="375" y="195" fill="#a78bfa" font-family="monospace" font-size="12">116 B (1.16%)</text>

    <line x1="25" y1="218" x2="385" y2="218" stroke="#334155" stroke-width="1"/>
    <text x="205" y="240" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      polycryst cuts Meta Zstandard size in half (50% reduction!)
    </text>
  </g>

  <!-- Panel 2: Harmonic Stride (2,375 Bytes) -->
  <g transform="translate(500, 95)">
    <rect width="410" height="260" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect width="410" height="38" rx="12" fill="#38bdf8" fill-opacity="0.12"/>
    <text x="205" y="25" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      HARMONIC PROGRESSIONS (2,375 BYTES)
    </text>

    <!-- Bars -->
    <!-- polycryst: 108 B -->
    <text x="25" y="75" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">polycryst .cryst</text>
    <rect x="155" y="61" width="115" height="18" rx="4" fill="url(#polyGrad)"/>
    <text x="280" y="75" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">108 B (4.55%) [WINNER]</text>

    <!-- zstd -19: 119 B -->
    <text x="25" y="115" fill="#93c5fd" font-family="monospace" font-size="12">zstd -19 (Meta)</text>
    <rect x="155" y="101" width="128" height="18" rx="4" fill="url(#zstdGrad)"/>
    <text x="295" y="115" fill="#60a5fa" font-family="monospace" font-size="12">119 B (5.01%)</text>

    <!-- gzip -9: 153 B -->
    <text x="25" y="155" fill="#fde68a" font-family="monospace" font-size="12">gzip -9</text>
    <rect x="155" y="141" width="165" height="18" rx="4" fill="url(#gzipGrad)"/>
    <text x="330" y="155" fill="#fbbf24" font-family="monospace" font-size="12">153 B (6.44%)</text>

    <!-- xz -9: 180 B -->
    <text x="25" y="195" fill="#ddd6fe" font-family="monospace" font-size="12">xz -9</text>
    <rect x="155" y="181" width="195" height="18" rx="4" fill="url(#xzGrad)"/>
    <text x="360" y="195" fill="#a78bfa" font-family="monospace" font-size="12">180 B (7.58%)</text>

    <line x1="25" y1="218" x2="385" y2="218" stroke="#334155" stroke-width="1"/>
    <text x="205" y="240" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Decisive victory over zstd, gzip, and xz with 100% SHA-256 match
    </text>
  </g>
</svg>
