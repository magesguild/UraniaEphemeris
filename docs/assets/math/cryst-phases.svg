<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="solidGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="coherentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="attractorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="vaporGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="42" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    THE FOUR THERMODYNAMIC PHASE STATES OF DATA
  </text>
  <text x="480" y="66" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" text-anchor="middle">
    Polymorphic Phase Space Decomposition in the Andean Crystalline Architecture (ACCS-2026)
  </text>

  <!-- 4 Pillars -->
  <!-- 1. Solid Phase -->
  <g transform="translate(30, 95)">
    <rect width="210" height="345" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="210" height="36" rx="10" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="105" y="24" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      1. SOLID PHASE
    </text>
    <text x="105" y="55" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Uniform Monocrystal</text>
    <text x="105" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">T = 0, &#8711;U = 0</text>

    <!-- Visual Crystal Lattice -->
    <rect x="25" y="90" width="160" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="55" cy="115" r="8" fill="#38bdf8"/>
    <circle cx="105" cy="115" r="8" fill="#38bdf8"/>
    <circle cx="155" cy="115" r="8" fill="#38bdf8"/>
    <circle cx="55" cy="155" r="8" fill="#38bdf8"/>
    <circle cx="105" cy="155" r="8" fill="#38bdf8"/>
    <circle cx="155" cy="155" r="8" fill="#38bdf8"/>

    <text x="105" y="205" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mechanism:</text>
    <text x="105" y="224" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" text-anchor="middle">Single-cycle RLE Dynamics</text>
    <text x="105" y="240" fill="#7dd3fc" font-family="monospace" font-size="11" text-anchor="middle">Vectorized Ground State</text>

    <rect x="15" y="260" width="180" height="65" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="105" y="280" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">10,000 'A's &#8594; 11 B</text>
    <text x="105" y="300" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" text-anchor="middle">99.89% Size Reduction</text>
    <text x="105" y="315" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9" text-anchor="middle">(Beats zstd by 50%)</text>
  </g>

  <!-- 2. Coherent Phase -->
  <g transform="translate(260, 95)">
    <rect width="210" height="345" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="210" height="36" rx="10" fill="#34d399" fill-opacity="0.15"/>
    <text x="105" y="24" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      2. COHERENT PHASE
    </text>
    <text x="105" y="55" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Harmonic / KAM Stride</text>
    <text x="105" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">x(i) = a + i &#183; &#948;</text>

    <!-- Visual Ramps -->
    <rect x="25" y="90" width="160" height="90" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="40,165 65,145 90,125 115,105 140,85" stroke="#34d399" stroke-width="2.5" fill="none"/>
    <circle cx="40" cy="165" r="4" fill="#6ee7b7"/>
    <circle cx="65" cy="145" r="4" fill="#6ee7b7"/>
    <circle cx="90" cy="125" r="4" fill="#6ee7b7"/>
    <circle cx="115" cy="105" r="4" fill="#6ee7b7"/>
    <circle cx="140" cy="85" r="4" fill="#6ee7b7"/>

    <text x="105" y="205" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mechanism:</text>
    <text x="105" y="224" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" text-anchor="middle">Affine Geodesic Generator</text>
    <text x="105" y="240" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">Harmonic Stride Invariant</text>

    <rect x="15" y="260" width="180" height="65" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="105" y="280" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2,375 B Ramps &#8594; 108 B</text>
    <text x="105" y="300" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" text-anchor="middle">95.45% Size Reduction</text>
    <text x="105" y="315" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9" text-anchor="middle">(Beats zstd at 119 B)</text>
  </g>

  <!-- 3. Attractor Basins -->
  <g transform="translate(490, 95)">
    <rect width="210" height="345" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="210" height="36" rx="10" fill="#fbbf24" fill-opacity="0.15"/>
    <text x="105" y="24" fill="#fde68a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      3. ATTRACTORS
    </text>
    <text x="105" y="55" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">Semantic Centroids</text>
    <text x="105" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Gravity Wells</text>

    <!-- Visual Attractor Well -->
    <rect x="25" y="90" width="160" height="90" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="105" cy="135" rx="65" ry="25" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3"/>
    <ellipse cx="105" cy="135" rx="40" ry="15" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="105" cy="135" r="9" fill="#f59e0b"/>

    <text x="105" y="205" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mechanism:</text>
    <text x="105" y="224" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" text-anchor="middle">Global Centroid Indexing</text>
    <text x="105" y="240" fill="#fde68a" font-family="monospace" font-size="11" text-anchor="middle">Gravitational Potential Well</text>

    <rect x="15" y="260" width="180" height="65" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="105" y="280" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">High-Mass Semantic Centroids</text>
    <text x="105" y="300" fill="#fef3c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" text-anchor="middle">Multi-KB Global Savings</text>
    <text x="105" y="315" fill="#fde68a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9" text-anchor="middle">Fixed Coordinate Basin</text>
  </g>

  <!-- 4. Vapor Phase -->
  <g transform="translate(720, 95)">
    <rect width="210" height="345" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="210" height="36" rx="10" fill="#f87171" fill-opacity="0.15"/>
    <text x="105" y="24" fill="#fca5a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      4. VAPOR PHASE
    </text>
    <text x="105" y="55" fill="#f87171" font-family="monospace" font-size="11" text-anchor="middle">Thermal Residuals</text>
    <text x="105" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">High Entropy / Noise</text>

    <!-- Visual Vapor Particles -->
    <rect x="25" y="90" width="160" height="90" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="50" cy="110" r="3" fill="#f87171"/>
    <circle cx="120" cy="105" r="4" fill="#fca5a5"/>
    <circle cx="85" cy="135" r="3" fill="#f87171"/>
    <circle cx="150" cy="140" r="3" fill="#fca5a5"/>
    <circle cx="65" cy="160" r="4" fill="#f87171"/>
    <circle cx="130" cy="165" r="3" fill="#fca5a5"/>

    <text x="105" y="205" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mechanism:</text>
    <text x="105" y="224" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" text-anchor="middle">Sliding Geodesic Echoes</text>
    <text x="105" y="240" fill="#fca5a5" font-family="monospace" font-size="11" text-anchor="middle">Adaptive Horizon Tracking</text>

    <rect x="15" y="260" width="180" height="65" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="105" y="280" fill="#f87171" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">TRNG: 10,407 B (+167B)</text>
    <text x="105" y="300" fill="#fecaca" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" text-anchor="middle">2nd Law of Thermo Verified</text>
    <text x="105" y="315" fill="#fca5a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9" text-anchor="middle">Zero False Claims</text>
  </g>
</svg>
