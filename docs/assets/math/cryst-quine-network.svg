<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bg4)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="42" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    AUTONOMOUS QUINE NETWORK TRANSMISSION
  </text>
  <text x="480" y="66" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" text-anchor="middle">
    Zero-Runtime Self-Extracting Executable Streaming across Sovereign &amp; Air-Gapped Networks
  </text>

  <!-- Node A: Sovereign Origin -->
  <g transform="translate(50, 110)">
    <rect width="240" height="260" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="32" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      1. ORIGIN NODE
    </text>
    <text x="120" y="52" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Server / Sat Uplink</text>

    <rect x="20" y="70" width="200" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="90" fill="#cbd5e1" font-family="monospace" font-size="11">Raw Data Payload</text>
    <text x="30" y="105" fill="#94a3b8" font-family="monospace" font-size="10">Firmware / Tensor / Stream</text>

    <text x="120" y="135" fill="#38bdf8" font-size="14" text-anchor="middle">&#8595; polycryst compile</text>

    <rect x="20" y="150" width="200" height="95" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="120" y="172" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">ELF64 Quine Binary</text>
    <text x="30" y="195" fill="#7dd3fc" font-family="monospace" font-size="10">&#8226; 168B Kernel Bootstrap</text>
    <text x="30" y="212" fill="#7dd3fc" font-family="monospace" font-size="10">&#8226; Embedded Decoder Engine</text>
    <text x="30" y="229" fill="#7dd3fc" font-family="monospace" font-size="10">&#8226; Crystalline Payload</text>
  </g>

  <!-- The Network Pipe -->
  <g transform="translate(310, 210)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="url(#wireGrad)" stroke-width="4" stroke-dasharray="8,6"/>
    <polygon points="340,0 325,-6 325,6" fill="#10b981"/>

    <rect x="55" y="-55" width="230" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="170" y="-35" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
      Raw Wire Stream
    </text>
    <text x="170" y="-19" fill="#94a3b8" font-family="monospace" font-size="10.5" text-anchor="middle">
      nc / curl / LoRa / Laser Inter-Sat
    </text>
  </g>

  <!-- Node B: Remote Sovereign Edge -->
  <g transform="translate(670, 110)">
    <rect width="240" height="260" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="32" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      2. TARGET NODE
    </text>
    <text x="120" y="52" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Air-Gapped / Edge Silicon</text>

    <rect x="20" y="70" width="200" height="55" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="120" y="90" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ZERO RUNTIME NEEDED</text>
    <text x="120" y="105" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">No libc, No xz, No tar</text>
    <text x="120" y="118" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">Runs directly on Linux syscalls</text>

    <text x="120" y="145" fill="#10b981" font-size="14" text-anchor="middle">&#8595; execute in memory</text>

    <rect x="20" y="160" width="200" height="85" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="182" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Exact Reconstruction</text>
    <text x="30" y="205" fill="#cbd5e1" font-family="monospace" font-size="10">&#8226; Multi-GB/s Throughput</text>
    <text x="30" y="222" fill="#cbd5e1" font-family="monospace" font-size="10">&#8226; Direct Framebuffer / Memory</text>
    <text x="30" y="239" fill="#a7f3d0" font-family="monospace" font-size="10">&#8226; Halts at StillPoint (T_STOP)</text>
  </g>
</svg>
