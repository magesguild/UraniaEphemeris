<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">NIST SP 800-90B Physical Entropy Source Architecture</title>
  <desc id="desc">Block diagram of the NIST SP 800-90B physical entropy validation architecture showing continuous health tests, raw min-entropy audit tap, and non-linear conditioning.</desc>
  <defs>
    <linearGradient id="bg90" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="arrow-flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#9db8e8"/>
      <stop offset="50%" stop-color="#ecc878"/>
      <stop offset="100%" stop-color="#73d69b"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="336" rx="16" fill="url(#bg90)" stroke="#233554" stroke-width="2"/>
  <text x="480" y="34" text-anchor="middle" fill="#ecc878" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" font-weight="bold">NIST SP 800-90B MANDATED PHYSICAL VALIDATION CHAIN</text>
  <text x="480" y="54" text-anchor="middle" fill="#7987a6" font-family="Georgia, serif" font-size="12" font-style="italic">Proving True Randomness via Pre-Conditioning Raw Min-Entropy &amp; Continuous Health Monitoring</text>

  <!-- 4 Main Stages -->
  <!-- Stage 1: Physical Noise Source -->
  <g transform="translate(30, 75)">
    <rect width="200" height="180" rx="10" fill="#0d1829" stroke="#3b527a" stroke-width="1.5"/>
    <rect x="8" y="8" width="184" height="26" rx="5" fill="#172640"/>
    <text x="100" y="25" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">1. NOISE SOURCE</text>
    <text x="100" y="60" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Silicon Physics</text>
    <text x="100" y="82" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Johnson-Nyquist</text>
    <text x="100" y="100" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">v_n² = 4 k_B T R Δf</text>
    <text x="100" y="125" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Ring Jitter Δt</text>
    <text x="100" y="145" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">FPGA Ring Oscillators</text>
    <text x="100" y="165" text-anchor="middle" fill="#aebbd2" font-family="Arial, sans-serif" font-size="10" font-style="italic">Thermal Ground State</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(235, 155)">
    <line x1="0" y1="10" x2="25" y2="10" stroke="url(#arrow-flow)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="25,6 35,10 25,14" fill="#ecc878"/>
    <text x="17" y="-2" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="9">Raw</text>
  </g>

  <!-- Stage 2: Continuous Health Tests -->
  <g transform="translate(275, 75)">
    <rect width="200" height="180" rx="10" fill="#0d1829" stroke="#8c6d32" stroke-width="1.5"/>
    <rect x="8" y="8" width="184" height="26" rx="5" fill="#2d2413"/>
    <text x="100" y="25" text-anchor="middle" fill="#ecc878" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2. HEALTH TESTS</text>
    <text x="100" y="60" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Online Invariants</text>
    <text x="100" y="82" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Repetition Count</text>
    <text x="100" y="100" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Stuck-bit cutoff (α=2⁻³⁰)</text>
    <text x="100" y="125" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Adaptive Proportion</text>
    <text x="100" y="145" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">1024-bit window check</text>
    <text x="100" y="165" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Failsafe Auto-Shutdown</text>
  </g>

  <!-- Flow 2 (with Audit Tap) -->
  <g transform="translate(480, 155)">
    <line x1="0" y1="10" x2="25" y2="10" stroke="url(#arrow-flow)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="25,6 35,10 25,14" fill="#ecc878"/>
    <!-- Branch to Audit Tap -->
    <line x1="12" y1="10" x2="12" y2="85" stroke="#ecc878" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="8,85 12,95 16,85" fill="#ecc878"/>
    <text x="12" y="-2" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="9">Live</text>
  </g>

  <!-- Stage 3: Conditioning -->
  <g transform="translate(520, 75)">
    <rect width="200" height="180" rx="10" fill="#0d1829" stroke="#3b6e50" stroke-width="1.5"/>
    <rect x="8" y="8" width="184" height="26" rx="5" fill="#142c1e"/>
    <text x="100" y="25" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">3. CONDITIONING</text>
    <text x="100" y="60" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Mathematical Seal</text>
    <text x="100" y="82" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">AS199 Matrix</text>
    <text x="100" y="100" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Non-Linear GF(2) Map</text>
    <text x="100" y="125" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">KAM Phase Strides</text>
    <text x="100" y="145" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">θ_{n+1} = θ_n + ϕ⁻¹</text>
    <text x="100" y="165" text-anchor="middle" fill="#aebbd2" font-family="Arial, sans-serif" font-size="10" font-style="italic">Decouples Harmonics</text>
  </g>

  <!-- Flow 3 -->
  <g transform="translate(725, 155)">
    <line x1="0" y1="10" x2="25" y2="10" stroke="url(#arrow-flow)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="25,6 35,10 25,14" fill="#73d69b"/>
    <text x="17" y="-2" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="9">PQC</text>
  </g>

  <!-- Stage 4: Certified Entropy Output -->
  <g transform="translate(765, 75)">
    <rect width="165" height="180" rx="10" fill="#0d1829" stroke="#73d69b" stroke-width="2"/>
    <rect x="8" y="8" width="149" height="26" rx="5" fill="#142c1e"/>
    <text x="82" y="25" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">4. VERIFIED TRNG</text>
    <text x="82" y="60" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Wire Output</text>
    <text x="82" y="85" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">H = 7.9972 b/B</text>
    <text x="82" y="105" text-anchor="middle" fill="#aebbd2" font-family="Arial, sans-serif" font-size="11">99.9657% Ceiling</text>
    <text x="82" y="130" text-anchor="middle" fill="#ecc878" font-family="Arial, sans-serif" font-size="11">NIST SP 800-22</text>
    <text x="82" y="148" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">100% SUITE PASS</text>
    <text x="82" y="168" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">&lt; 50 µW on ECP5</text>
  </g>

  <!-- Lower Callout: NIST SP 800-90B Raw Min-Entropy Audit Point -->
  <g transform="translate(275, 275)">
    <rect width="445" height="48" rx="6" fill="#1c2b42" stroke="#ecc878" stroke-width="1.5"/>
    <text x="222" y="20" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11" font-weight="bold">NIST SP 800-90B MANDATED RAW AUDIT TAP (PRE-CONDITIONING)</text>
    <text x="222" y="38" text-anchor="middle" fill="#eef3ff" font-family="Arial, sans-serif" font-size="11">Raw Min-Entropy Tested: <tspan fill="#73d69b" font-weight="bold">H_min ≥ 0.86 bits/bit</tspan> across 10 NIST SP 800-90B Estimators</text>
  </g>
</svg>
