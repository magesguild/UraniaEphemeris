<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Physical Thermodynamic Modulation Proof vs PRNG Replay</title>
  <desc id="desc">Graph illustrating how the Andean physical noise source variance scales with the square root of physical temperature (Johnson-Nyquist law) compared to the flat, zero-temperature response of a software PRNG or recorded replay file.</desc>
  <defs>
    <linearGradient id="chart-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="296" rx="16" fill="url(#chart-bg)" stroke="#233554" stroke-width="2"/>
  <text x="480" y="32" text-anchor="middle" fill="#ecc878" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" font-weight="bold">PHYSICAL THERMODYNAMIC MODULATION PROOF: NOISE VARIANCE vs TEMPERATURE</text>
  <text x="480" y="52" text-anchor="middle" fill="#7987a6" font-family="Georgia, serif" font-size="12" font-style="italic">Empirical Falsification: Proving Silicon Reality vs PRNG Algorithmic Simulation</text>

  <!-- Left: The Graph -->
  <g transform="translate(60, 75)">
    <!-- Axes -->
    <line x1="50" y1="160" x2="480" y2="160" stroke="#3b527a" stroke-width="2"/>
    <line x1="50" y1="20" x2="50" y2="160" stroke="#3b527a" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="265" y="190" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11">Ambient Silicon Temperature (°C)</text>
    <text x="-90" y="18" transform="rotate(-90)" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11">Raw Noise Variance (σ²)</text>

    <!-- X-ticks -->
    <text x="50" y="174" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">-20°C</text>
    <text x="157" y="174" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">0°C</text>
    <text x="265" y="174" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">+25°C (Room)</text>
    <text x="372" y="174" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">+55°C</text>
    <text x="480" y="174" text-anchor="middle" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">+85°C</text>

    <!-- Curve 1: Andean Physical Noise (T^{1/2} scaling) -->
    <!-- Points: (-20C / 253K -> ~80), (0C / 273K -> ~95), (25C / 298K -> ~115), (55C / 328K -> ~135), (85C / 358K -> ~150) -->
    <path d="M50 125 Q 265 85, 480 35" fill="none" stroke="#73d69b" stroke-width="3"/>
    <circle cx="50" cy="125" r="4" fill="#73d69b"/>
    <circle cx="157" cy="107" r="4" fill="#73d69b"/>
    <circle cx="265" cy="85" r="5" fill="#ecc878" stroke="#14213d" stroke-width="1.5"/>
    <circle cx="372" cy="62" r="4" fill="#73d69b"/>
    <circle cx="480" cy="35" r="4" fill="#73d69b"/>

    <!-- Curve 2: Software PRNG / Replay File (Flat Line) -->
    <line x1="50" y1="100" x2="480" y2="100" stroke="#e27c7c" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="265" cy="100" r="4" fill="#e27c7c"/>
  </g>

  <!-- Right: Legend & Scientific Explanations -->
  <g transform="translate(580, 80)">
    <!-- Legend Card 1: Andean Physical -->
    <rect width="330" height="85" rx="8" fill="#142c1e" stroke="#3b6e50" stroke-width="1.5"/>
    <line x1="15" y1="22" x2="35" y2="22" stroke="#73d69b" stroke-width="3"/>
    <circle cx="25" cy="22" r="4" fill="#ecc878"/>
    <text x="45" y="26" fill="#73d69b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Andean Physical Noise Source</text>
    <text x="15" y="48" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">σ² ∝ 4 k_B T R Δf  (dσ/dT &gt; 0)</text>
    <text x="15" y="66" fill="#a3e3bc" font-family="Arial, sans-serif" font-size="10">Variance dynamically scales with thermal temperature.</text>
    <text x="15" y="78" fill="#a3e3bc" font-family="Arial, sans-serif" font-size="10">Proves non-simulated thermodynamic silicon reality.</text>

    <!-- Legend Card 2: Software PRNG Replay -->
    <g transform="translate(0, 95)">
      <rect width="330" height="75" rx="8" fill="#241419" stroke="#7a3b48" stroke-width="1.5"/>
      <line x1="15" y1="22" x2="35" y2="22" stroke="#e27c7c" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="45" y="26" fill="#f5a4a4" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Software PRNG / Flash Replay File</text>
      <text x="15" y="48" fill="#f5a4a4" font-family="'Courier New', monospace" font-size="11">dσ/dT = 0  (Static Algorithm)</text>
      <text x="15" y="66" fill="#c2858d" font-family="Arial, sans-serif" font-size="10">Zero response to physical thermal modulation.</text>
    </g>
  </g>

  <!-- Bottom Proof Footnote -->
  <text x="480" y="280" text-anchor="middle" fill="#7987a6" font-family="Georgia, serif" font-size="11" font-style="italic">Cold-Boot Invariant: Zero identical 64-bit startup sequences across 1,000 cold power cycles on OrangeCrab ECP5 hardware.</text>
</svg>
