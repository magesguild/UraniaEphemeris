<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">NIST SP 800-22 Live Empirical Verification Telemetry Dashboard</title>
  <desc id="desc">Comprehensive empirical telemetry dashboard showing the harvest parameters, intermediate calculations, test statistics, p-values, and pass verdicts for all five NIST SP 800-22 tests across 524,288 physical bits.</desc>
  <defs>
    <linearGradient id="term-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
  </defs>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="956" height="516" rx="14" fill="url(#term-bg)" stroke="#233554" stroke-width="2"/>

  <!-- Terminal Header Bar -->
  <path d="M2 16C2 8.268 8.268 2 16 2h928c7.732 0 14 6.268 14 14v30H2V16z" fill="#0d1829" stroke="#233554" stroke-width="1"/>
  <circle cx="24" cy="22" r="5" fill="#e27c7c"/>
  <circle cx="40" cy="22" r="5" fill="#ecc878"/>
  <circle cx="56" cy="22" r="5" fill="#73d69b"/>
  <text x="480" y="27" text-anchor="middle" fill="#9db8e8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">ANDEAN PHYSICAL TRNG — NIST SP 800-22 SCIENTIFIC TELEMETRY</text>

  <!-- Telemetry Banner: Harvesting -->
  <g transform="translate(25, 48)">
    <rect width="910" height="42" rx="6" fill="#0c1729" stroke="#1f2c45" stroke-width="1"/>
    <text x="20" y="26" fill="#ecc878" font-family="'Courier New', monospace" font-size="11" font-weight="bold">SOURCE:</text>
    <text x="75" y="26" fill="#d9e2f2" font-family="Arial, sans-serif" font-size="12">Johnson-Nyquist Electron Agitation (300 K)</text>
    <text x="390" y="26" fill="#ecc878" font-family="'Courier New', monospace" font-size="11" font-weight="bold">HARVEST:</text>
    <text x="455" y="26" fill="#d9e2f2" font-family="Arial, sans-serif" font-size="12">65,536 Bytes = 524,288 Bits</text>
    <text x="710" y="26" fill="#ecc878" font-family="'Courier New', monospace" font-size="11" font-weight="bold">CONDITIONING:</text>
    <text x="810" y="26" fill="#73d69b" font-family="Arial, sans-serif" font-size="12">AS199 + KAM ϕ⁻¹</text>
  </g>

  <!-- Row 1: Tests 1 & 2 -->
  <!-- Test 1: Monobit -->
  <g transform="translate(25, 102)">
    <rect width="445" height="156" rx="8" fill="#0c1729" stroke="#253856" stroke-width="1"/>
    <rect x="10" y="10" width="425" height="26" rx="4" fill="#182742"/>
    <text x="20" y="27" fill="#9db8e8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">TEST 1: FREQUENCY (MONOBIT) — FAIR COIN INVARIANT</text>
    <text x="20" y="56" fill="#aebbd2" font-family="Arial, sans-serif" font-size="12">Formula: S_N = Σ(2b_i - 1),  S_obs = |S_N| / √N,  p = erfc(S_obs / √2)</text>
    <text x="20" y="78" fill="#7987a6" font-family="'Courier New', monospace" font-size="11">• Ones (N1): 261,399 (49.858%)   • Zeros (N0): 262,889 (50.142%)</text>
    <text x="20" y="98" fill="#7987a6" font-family="'Courier New', monospace" font-size="11">• Net Delta: -1,490 bits         • Test Statistic: S_obs = 2.057791</text>
    <text x="20" y="122" fill="#d9e2f2" font-family="'Courier New', monospace" font-size="12">Calculated p-value: <tspan fill="#73d69b" font-weight="bold">0.039610</tspan> (Threshold ≥ 0.001000)</text>
    <rect x="20" y="132" width="405" height="16" rx="3" fill="#113320"/>
    <text x="222" y="144" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED: ZERO DC VOLTAGE DRIFT / UNBIASED FAIR COIN</text>
  </g>

  <!-- Test 2: Runs -->
  <g transform="translate(490, 102)">
    <rect width="445" height="156" rx="8" fill="#0c1729" stroke="#253856" stroke-width="1"/>
    <rect x="10" y="10" width="425" height="26" rx="4" fill="#182742"/>
    <text x="20" y="27" fill="#9db8e8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">TEST 2: RUNS TEST — OSCILLATION &amp; NO-HYSTERESIS</text>
    <text x="20" y="56" fill="#aebbd2" font-family="Arial, sans-serif" font-size="12">Formula: V_N = 1 + Σ(b_k ⊕ b_{k+1}),  Z = |V - E[V]| / σ_V</text>
    <text x="20" y="78" fill="#7987a6" font-family="'Courier New', monospace" font-size="11">• Proportion π: 0.498579        • Observed Runs (V): 262,075</text>
    <text x="20" y="98" fill="#7987a6" font-family="'Courier New', monospace" font-size="11">• Expected Runs E[V]: 262,141.88 • Transition Delta: -66.88 runs</text>
    <text x="20" y="122" fill="#d9e2f2" font-family="'Courier New', monospace" font-size="12">Calculated p-value: <tspan fill="#73d69b" font-weight="bold">0.853432</tspan> (Threshold ≥ 0.001000)</text>
    <rect x="20" y="132" width="405" height="16" rx="3" fill="#113320"/>
    <text x="222" y="144" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED: ZERO CAPACITIVE HYSTERESIS / NO STICKY STATES</text>
  </g>

  <!-- Row 2: Tests 3, 4, 5 -->
  <!-- Test 3: Autocorrelation -->
  <g transform="translate(25, 270)">
    <rect width="290" height="175" rx="8" fill="#0c1729" stroke="#253856" stroke-width="1"/>
    <rect x="8" y="8" width="274" height="24" rx="4" fill="#182742"/>
    <text x="145" y="24" text-anchor="middle" fill="#9db8e8" font-family="'Courier New', monospace" font-size="10" font-weight="bold">TEST 3: AUTOCORRELATION (LAGS 1..32)</text>
    <text x="16" y="52" fill="#aebbd2" font-family="Arial, sans-serif" font-size="11">Null: Cor(X_i, X_{i+k}) = 0</text>
    <text x="16" y="72" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">Lag  1: p = 0.8478 (Match 50.01%)</text>
    <text x="16" y="88" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">Lag  2: p = 0.2029 (Match 49.91%)</text>
    <text x="16" y="104" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">Lag  4: p = 0.1358 (Match 49.90%)</text>
    <text x="16" y="120" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">Lag  8: p = 0.9076 (Match 50.01%)</text>
    <text x="16" y="136" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">Lag 16, 32: All p &gt; 0.72</text>
    <rect x="12" y="148" width="266" height="16" rx="3" fill="#113320"/>
    <text x="145" y="160" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="9" font-weight="bold">PASSED: ZERO PERIODIC BUS ECHOES</text>
  </g>

  <!-- Test 4: Chi-Squared -->
  <g transform="translate(335, 270)">
    <rect width="290" height="175" rx="8" fill="#0c1729" stroke="#253856" stroke-width="1"/>
    <rect x="8" y="8" width="274" height="24" rx="4" fill="#182742"/>
    <text x="145" y="24" text-anchor="middle" fill="#9db8e8" font-family="'Courier New', monospace" font-size="10" font-weight="bold">TEST 4: CHI-SQUARED (χ²) UNIFORMITY</text>
    <text x="16" y="52" fill="#aebbd2" font-family="Arial, sans-serif" font-size="11">Formula: χ² = Σ (O_i - E)² / E</text>
    <text x="16" y="74" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Degrees of Freedom: df = 255</text>
    <text x="16" y="92" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Expected per Bin: E = 256.0 B</text>
    <text x="16" y="110" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Min / Max: 212 / 311 Bytes</text>
    <text x="16" y="132" fill="#d9e2f2" font-family="'Courier New', monospace" font-size="11">Statistic: <tspan fill="#73d69b" font-weight="bold">χ² = 249.83</tspan> (&lt; 310.46)</text>
    <rect x="12" y="148" width="266" height="16" rx="3" fill="#113320"/>
    <text x="145" y="160" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="9" font-weight="bold">PASSED: UNIFORM 256-BYTE SPACE</text>
  </g>

  <!-- Test 5: Shannon Entropy -->
  <g transform="translate(645, 270)">
    <rect width="290" height="175" rx="8" fill="#0c1729" stroke="#253856" stroke-width="1"/>
    <rect x="8" y="8" width="274" height="24" rx="4" fill="#182742"/>
    <text x="145" y="24" text-anchor="middle" fill="#9db8e8" font-family="'Courier New', monospace" font-size="10" font-weight="bold">TEST 5: SHANNON ENTROPY DENSITY</text>
    <text x="16" y="52" fill="#aebbd2" font-family="Arial, sans-serif" font-size="11">Formula: H = -Σ p_i log₂(p_i)</text>
    <text x="16" y="74" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Theoretical Max: 8.000000 b/B</text>
    <text x="16" y="92" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Measured H: 7.997259 b/B</text>
    <text x="16" y="110" fill="#7987a6" font-family="'Courier New', monospace" font-size="10">• Deficit: 0.002741 b/B</text>
    <text x="16" y="132" fill="#d9e2f2" font-family="'Courier New', monospace" font-size="11">Relative Density: <tspan fill="#73d69b" font-weight="bold">99.9657%</tspan></text>
    <rect x="12" y="148" width="266" height="16" rx="3" fill="#113320"/>
    <text x="145" y="160" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="9" font-weight="bold">PASSED: PURE INCOMPRESSIBLE WHITE NOISE</text>
  </g>

  <!-- Final Certification Verdict Banner -->
  <g transform="translate(25, 458)">
    <rect width="910" height="42" rx="6" fill="#142c1e" stroke="#3b6e50" stroke-width="1.5"/>
    <text x="455" y="26" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="1">FINAL VERDICT: 100% PASS ACROSS ALL FIVE SCIENTIFIC TESTS (NIST SP 800-22 &amp; FIPS 140-2)</text>
  </g>
</svg>
