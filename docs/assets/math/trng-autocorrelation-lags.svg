<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Serial Autocorrelation across Harmonic Lags 1..32</title>
  <desc id="desc">Visual verification of zero temporal memory across harmonic lags 1, 2, 4, 8, 16, and 32, confirming complete absence of bus echoes or memory refresh patterns.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#card-bg)" stroke="#233554" stroke-width="2"/>
  <text x="480" y="36" text-anchor="middle" fill="#ecc878" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" font-weight="bold">SERIAL AUTOCORRELATION — ZERO FUTURE MEMORY INVARIANT</text>
  <text x="480" y="58" text-anchor="middle" fill="#7987a6" font-family="Georgia, serif" font-size="12" font-style="italic">Null Hypothesis: Knowing bit i gives ZERO information about bit i + lag: Cor(X_i, X_{i+k}) = 0</text>

  <!-- 6 Lag Boxes -->
  <g transform="translate(35, 75)">
    <!-- Lag 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 1</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,287</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 50.01%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = +0.192</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.8478</text>
    </g>

    <!-- Lag 2 -->
    <g transform="translate(151, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 2</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,286</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 49.91%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = -1.273</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.2029</text>
    </g>

    <!-- Lag 4 -->
    <g transform="translate(302, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 4</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,284</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 49.90%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = -1.492</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.1358</text>
    </g>

    <!-- Lag 8 -->
    <g transform="translate(453, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 8</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,280</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 50.01%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = +0.116</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.9076</text>
    </g>

    <!-- Lag 16 -->
    <g transform="translate(604, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 16</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,272</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 49.98%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = -0.351</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.7257</text>
    </g>

    <!-- Lag 32 -->
    <g transform="translate(755, 0)">
      <rect width="135" height="135" rx="8" fill="#0d1829" stroke="#253856" stroke-width="1.5"/>
      <text x="67" y="26" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAG 32</text>
      <text x="67" y="52" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="10">Pairs: 524,256</text>
      <text x="67" y="70" text-anchor="middle" fill="#eef3ff" font-family="'Courier New', monospace" font-size="11">Match: 49.99%</text>
      <text x="67" y="90" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = -0.116</text>
      <rect x="18" y="102" width="100" height="20" rx="4" fill="#113320" stroke="#287848"/>
      <text x="67" y="116" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">p = 0.9076</text>
    </g>
  </g>

  <text x="480" y="240" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="12" font-weight="bold">ALL HARMONIC LAGS PASS (p &gt;&gt; 0.001) · ZERO PERIODIC MEMORY OR BUS ECHOES</text>
</svg>
