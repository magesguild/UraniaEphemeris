<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">NIST SP 800-22 Five-Gate Mathematical Verification Battery</title>
  <desc id="desc">Visual summary of the five statistical test gates passed by the Andean Physical TRNG on 524,288 bits of physical silicon entropy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="316" rx="16" fill="url(#bg)" stroke="#233554" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#ecc878" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" font-weight="bold">THE FIVE MATHEMATICAL INVARIANTS OF TRUE RANDOMNESS</text>

  <!-- 5 Cards Layout -->
  <!-- Card 1: Monobit -->
  <g transform="translate(30, 65)">
    <rect width="168" height="205" rx="10" fill="#0c1729" stroke="#253856" stroke-width="1.5"/>
    <rect x="8" y="8" width="152" height="24" rx="5" fill="#182742"/>
    <text x="84" y="24" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">1. MONOBIT</text>
    <text x="84" y="55" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13">Coin Fairness</text>
    <text x="84" y="80" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">S_obs = |N₁ - N₀|/√N</text>
    <text x="84" y="110" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Ones: 49.86%</text>
    <text x="84" y="128" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Zeros: 50.14%</text>
    <text x="84" y="152" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">p = 0.0396</text>
    <rect x="24" y="170" width="120" height="22" rx="4" fill="#113320" stroke="#287848"/>
    <text x="84" y="185" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED (≥ 0.001)</text>
  </g>

  <!-- Card 2: Runs -->
  <g transform="translate(212, 65)">
    <rect width="168" height="205" rx="10" fill="#0c1729" stroke="#253856" stroke-width="1.5"/>
    <rect x="8" y="8" width="152" height="24" rx="5" fill="#182742"/>
    <text x="84" y="24" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2. RUNS TEST</text>
    <text x="84" y="55" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13">Zero Hysteresis</text>
    <text x="84" y="80" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Z = |V - E[V]|/σ</text>
    <text x="84" y="110" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Observed: 262,075</text>
    <text x="84" y="128" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Expected: 262,142</text>
    <text x="84" y="152" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">p = 0.8534</text>
    <rect x="24" y="170" width="120" height="22" rx="4" fill="#113320" stroke="#287848"/>
    <text x="84" y="185" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED (≥ 0.001)</text>
  </g>

  <!-- Card 3: Autocorrelation -->
  <g transform="translate(394, 65)">
    <rect width="172" height="205" rx="10" fill="#0c1729" stroke="#253856" stroke-width="1.5"/>
    <rect x="8" y="8" width="156" height="24" rx="5" fill="#182742"/>
    <text x="86" y="24" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">3. AUTOCORRELATION</text>
    <text x="86" y="55" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13">Zero Periodic Memory</text>
    <text x="86" y="80" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">Cor(X_i, X_{i+k})</text>
    <text x="86" y="110" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Lags 1, 2, 4, 8, 16, 32</text>
    <text x="86" y="128" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">All Lags Tested</text>
    <text x="86" y="152" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">All p &gt; 0.13</text>
    <rect x="26" y="170" width="120" height="22" rx="4" fill="#113320" stroke="#287848"/>
    <text x="86" y="185" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED (No Echoes)</text>
  </g>

  <!-- Card 4: Chi-Squared -->
  <g transform="translate(580, 65)">
    <rect width="168" height="205" rx="10" fill="#0c1729" stroke="#253856" stroke-width="1.5"/>
    <rect x="8" y="8" width="152" height="24" rx="5" fill="#182742"/>
    <text x="84" y="24" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">4. CHI-SQUARED (χ²)</text>
    <text x="84" y="55" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13">8-Bit Uniformity</text>
    <text x="84" y="80" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">χ² = Σ (O_i - E)²/E</text>
    <text x="84" y="110" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">df = 255 (256 Bins)</text>
    <text x="84" y="128" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Critical: &lt; 310.46</text>
    <text x="84" y="152" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">χ² = 249.83</text>
    <rect x="24" y="170" width="120" height="22" rx="4" fill="#113320" stroke="#287848"/>
    <text x="84" y="185" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED (Uniform)</text>
  </g>

  <!-- Card 5: Shannon Entropy -->
  <g transform="translate(762, 65)">
    <rect width="168" height="205" rx="10" fill="#0c1729" stroke="#253856" stroke-width="1.5"/>
    <rect x="8" y="8" width="152" height="24" rx="5" fill="#182742"/>
    <text x="84" y="24" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">5. SHANNON H</text>
    <text x="84" y="55" text-anchor="middle" fill="#eef3ff" font-family="Georgia, serif" font-size="13">Incompressibility</text>
    <text x="84" y="80" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="11">H = -Σ p_i log₂(p_i)</text>
    <text x="84" y="110" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Max: 8.000000 b/B</text>
    <text x="84" y="128" text-anchor="middle" fill="#7987a6" font-family="Arial, sans-serif" font-size="11">Density: 99.9657%</text>
    <text x="84" y="152" text-anchor="middle" fill="#73d69b" font-family="'Courier New', monospace" font-size="13" font-weight="bold">7.997259 b/B</text>
    <rect x="24" y="170" width="120" height="22" rx="4" fill="#113320" stroke="#287848"/>
    <text x="84" y="185" text-anchor="middle" fill="#73d69b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PASSED (Pure White)</text>
  </g>

  <!-- Bottom Summary -->
  <text x="480" y="295" text-anchor="middle" fill="#ecc878" font-family="'Courier New', monospace" font-size="12" font-weight="bold">SAMPLE HARVEST: 524,288 BITS (65,536 BYTES) · VERDICT: 100% STATISTICAL PASS</text>
</svg>
