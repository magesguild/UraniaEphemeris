<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Spatial and viscosity components</title>
  <desc id="desc">Q space is proportional to active branching factor. Q viscosity is proportional to the reciprocal of the cache decay rate.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17243b"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="22" fill="url(#wash)" stroke="#344668" stroke-width="2"/>
  <line x1="480" y1="32" x2="480" y2="228" stroke="#344668" stroke-width="2"/>
  <text x="240" y="58" text-anchor="middle" fill="#ecc878" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">SPATIAL COMPONENT</text>
  <text x="720" y="58" text-anchor="middle" fill="#9db8e8" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">VISCOSITY COMPONENT</text>
  <text x="240" y="136" text-anchor="middle" fill="#f1f4fb" font-family="Georgia, 'Times New Roman', serif" font-size="48">
    <tspan>Q</tspan><tspan baseline-shift="sub" font-size="27">space</tspan><tspan> ∝ B</tspan><tspan baseline-shift="sub" font-size="27">active</tspan>
  </text>
  <text x="720" y="136" text-anchor="middle" fill="#f1f4fb" font-family="Georgia, 'Times New Roman', serif" font-size="44">
    <tspan>Q</tspan><tspan baseline-shift="sub" font-size="26">viscosity</tspan><tspan> ∝ </tspan><tspan>1</tspan><tspan baseline-shift="baseline"> / </tspan><tspan>λ</tspan><tspan baseline-shift="sub" font-size="25">decay</tspan>
  </text>
  <text x="240" y="190" text-anchor="middle" fill="#aebbd2" font-family="Georgia, 'Times New Roman', serif" font-size="18">Concurrent reasoning branches</text>
  <text x="720" y="190" text-anchor="middle" fill="#aebbd2" font-family="Georgia, 'Times New Roman', serif" font-size="18">Latent-cache persistence</text>
  <path d="M205 218h70M685 218h70" stroke="#ecc878" stroke-width="2" stroke-linecap="round" opacity=".75"/>
</svg>
